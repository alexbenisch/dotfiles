set -g default-terminal "tmux-256color"
set -g default-command /bin/zsh
set-option -g xterm-keys on

set -g history-limit 10000

set -g mouse on
bind-key m set-option -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Persist and restore Claude Code / AI assistant sessions across tmux restarts
set -g @plugin 'timvw/tmux-assistant-resurrect'

# fzf-based window/session renamer; prefix+T opens sesh picker, prefix+C-e renames session, prefix+C-w renames window
set -g @plugin 'yahddyyp/tmux-simple-renamers'
set -g @tmux-simple-renamers-sesh-integration 'on'

# Dracula theme
set -g @dracula-plugins "kubernetes-context git cpu-usage ram-usage continuum time"
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g @dracula-border-contrast true
set -g @dracula-refresh-rate 5

set -g @dracula-time-format "%H:%M"

set -g @dracula-kubernetes-hide-user true
set -g @dracula-kubernetes-eks-hide-arn true

set -g @dracula-git-show-current-symbol ✓
set -g @dracula-git-show-diff-symbol !
set -g @dracula-git-no-untracked-files true

set -g @dracula-continuum-mode countdown


if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.config/tmux/plugins/tmux-continuum/continuum.tmux
